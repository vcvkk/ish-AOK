name: build-unsigned
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install build dependencies
        run: |
          brew install llvm ninja libarchive meson

      - name: Build unsigned (retry on FB19282108 race)
        run: |
          for i in 1 2 3; do
            xcodebuild -project iSH-AOK.xcodeproj -scheme iSH \
              -sdk iphoneos -configuration Debug-ApplePleaseFixFB19282108 \
              -parallelizeTargets NO \
              build CODE_SIGNING_ALLOWED=NO \
              CONFIGURATION_BUILD_DIR=$PWD/build \
              IDEBuildOperationMaxNumberOfConcurrentCompileTasks=1 \
              && break
            echo "Build attempt $i failed, retrying..."
            sleep 5
          done

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/*.app Payload/
          zip -r iSH-AOK.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: iSH-AOK-ipa
          path: iSH-AOK.ipa
